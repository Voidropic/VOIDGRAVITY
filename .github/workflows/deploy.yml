name: Build, deploy VOIDGRAVITY and Gemini proxy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate Supabase configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN GitHub Actions secret."
            exit 1
          fi

          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID GitHub Actions secret."
            exit 1
          fi

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Missing SUPABASE_URL GitHub Actions secret."
            exit 1
          fi

          SUPABASE_PROJECT_REF="$(
            printf '%s' "$SUPABASE_URL" |
            sed -E 's#^https://##; s#\.supabase\.co/?$##'
          )"

          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "::error::SUPABASE_URL must look like https://YOUR_PROJECT_REF.supabase.co"
            exit 1
          fi

          echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"

          echo "Supabase configuration detected successfully."

      - name: Set Firebase project ID secret
        shell: bash
        run: |
          set -euo pipefail

          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes \
            "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"

      - name: Deploy Gemini proxy
        shell: bash
        run: |
          set -euo pipefail

          supabase functions deploy gemini-proxy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET || 'void-files' }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4
